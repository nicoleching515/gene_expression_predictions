## EpiBERT Contrastive SAE — Single source of truth for all hyperparameters
## Edit here; never hard-code values in scripts.

# ── Reproducibility ────────────────────────────────────────────────────────────
seed: 42

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  workspace:    /workspace/gene_expression_predictions
  project:      /workspace/gene_expression_predictions
  data:         /workspace/gene_expression_predictions/data
  atac_raw:     /workspace/gene_expression_predictions/data/atac
  atac_processed: /workspace/gene_expression_predictions/data/atac_processed
  genome:       /workspace/gene_expression_predictions/data/genome
  windows_bed:  /workspace/gene_expression_predictions/data/windows.bed
  eval_genes:   /workspace/gene_expression_predictions/data/eval_genes.tsv
  activations:  /workspace/gene_expression_predictions/activations
  saes:         /workspace/gene_expression_predictions/saes
  results:      /workspace/gene_expression_predictions/results
  outputs:      /workspace/gene_expression_predictions/outputs
  logs:         /workspace/gene_expression_predictions/logs
  checkpoint:   /workspace/epibert_models/pretrained/model1/ckpt-45
  checkpoint_m2: /workspace/epibert_models/pretrained/model2/ckpt-45
  checkpoint_ft: /workspace/epibert_models/fine_tuned/ckpt-16

# ── BAM file mapping ─────────────────────────────────────────────────────────
# ENCODE GRCh38 BAMs (ENCFF804MXV, ENCFF939JOT, ENCFF415FEC, ENCFF974NEA, ENCFF298OEW)
# HSC: GSE74912 SRR2920466 aligned to hg38 via bowtie2
bam_files:
  K562:         "/workspace/atac_bams/K562-ATAC.bam"
  HepG2:        "/workspace/atac_bams/HepG2-ATAC.bam"
  GM12878:      "/workspace/atac_bams/GM12878-ATAC.bam"
  HSC:          "/workspace/atac_bams/HSC-ATAC.bam"
  Liver:        "/workspace/atac_bams/Liver-ATAC.bam"
  NaiveB:       "/workspace/atac_bams/NaiveB-ATAC.bam"

# ── Context pairs ─────────────────────────────────────────────────────────────
pairs:
  blood:
    vitro: K562
    vivo:  HSC
  liver:
    vitro: HepG2
    vivo:  Liver
  lymph:
    vitro: GM12878
    vivo:  NaiveB

conditions:
  vitro: [K562, HepG2, GM12878]
  vivo:  [HSC, Liver, NaiveB]

all_conditions: [K562, HepG2, GM12878, HSC, Liver, NaiveB]

# ── Genomic windows ───────────────────────────────────────────────────────────
windows:
  chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9,
                chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17,
                chr18, chr19, chr20, chr21, chr22, chrX]
  n_windows: 9004
  window_bp: 131072        # 128 * 1024; divisible by 128 → 1024 output bins
  blacklist_url: "https://github.com/Boyle-Lab/Blacklist/raw/master/lists/hg38-blacklist.v2.bed.gz"

# ── Model architecture ────────────────────────────────────────────────────────
model:
  num_tracks: 170
  num_performer_layers: 8    # L
  hidden_dim: 1024            # d
  num_heads: 8
  head_dim: 128
  ffn_dim: 2048
  num_motifs: 693
  downsample_factor: 128      # seq_len → seq_len // 128 bins
  # Layer indices for activation capture (0-indexed)
  hook_layers:
    early: 2    # L//4
    mid:   4    # L//2
    late:  6    # 3*L//4

# ── ATAC normalization ────────────────────────────────────────────────────────
atac:
  normalize: rpm              # reads per million per bp
  smoothing_bp: 150           # gaussian smoothing window (bp)
  log1p: true                 # apply log1p after RPM normalization

# ── Activation collection ─────────────────────────────────────────────────────
activation:
  batch_size: 4              # windows per batch (start conservative, increase if mem ok)
  checkpoint_every: 1000     # save incremental checkpoint every N windows
  n_test_windows: 100        # for smoke-test run

# ── SAE hyperparameters (frozen — do not tune after Phase 4) ─────────────────
sae:
  expansion: 8               # latent_dim = expansion * hidden_dim
  k: 64                      # BatchTopK active features
  lr: 3.0e-4
  batch_size: 4096
  steps: 50000
  warmup_steps: 1000
  dead_feature_threshold_steps: 2500
  dead_feature_resample: true
  # QC gates
  qc:
    max_norm_mse: 0.05
    l0_min: 50
    l0_max: 100
    max_dead_frac: 0.05

# ── Analysis ──────────────────────────────────────────────────────────────────
analysis:
  n_permutations: 10000      # permutation test for null CDS distribution
  cds_shared_pct: 25         # < 25th percentile CDS → "shared"
  cds_vivo_pct: 90           # > 90th percentile → "vivo-enriched"
  cds_vitro_pct: 10          # < 10th percentile → "vitro-enriched"
  jaccard_switch_threshold: 0.3  # < 0.3 Jaccard → "context-switched"
  top_n_features: 50         # features to export per layer
  top_windows_n: 500         # windows to export per feature

# ── Ablation ─────────────────────────────────────────────────────────────────
ablation:
  target_layer: mid          # which layer to ablate (early/mid/late)
  k_sweep: [5, 10, 25, 50, 100]
  random_ablation_seeds: 5
  n_eval_genes: 200

# ── Steering ─────────────────────────────────────────────────────────────────
steering:
  alpha_sweep: [1.5, 2.0, 3.0, 5.0]
  beta_sweep:  [0.0, 0.25, 0.5]
  target_layer: mid

# ── Figures ───────────────────────────────────────────────────────────────────
figures:
  dpi: 300
  formats: [pdf, png]

# ── Multi-model settings (Phase 12) ───────────────────────────────────────────
multi_model:
  models:
    epibert:
      enabled: true
      # Uses existing EpiBERT checkpoints in epibert_models/
      hidden_dim: 1024
      num_layers: 8
      hook_layers:
        early: 2    # L//4
        mid:   4    # L//2
        late:  6    # 3L//4

    enformer:
      enabled: true
      pretrained: "EleutherAI/enformer-official-rough"
      local_path: "models/enformer-official-rough"   # populated by copy_models_to_workspace.py
      hidden_dim: 1536   # EnformerConfig().dim = 1536 (not 3072)
      num_layers: 11
      hook_layers:
        early: 2
        mid:   5
        late:  8
      # Input: 196,608 bp window (centre-crop from 131,072 bp windows)
      seq_len: 196608
      batch_size: 4   # A100 80GB has headroom; conv stem reduces seq 128x before transformer

    hyenadna:
      enabled: true
      pretrained: "LongSafari/hyenadna-medium-160k-seqlen-hf"
      local_path: "models/hyenadna-medium-160k"
      hidden_dim: 256
      num_layers: 8
      hook_layers:
        early: 1    # L//4
        mid:   3    # L//2
        late:  5    # 3L//4
      # Input: up to 160k bp; we use 4096 bp for speed
      max_seq_len: 4096
      batch_size: 16  # 2x increase; 131k-bp inputs but A100 has ample headroom

    nucleotide_transformer:
      enabled: true
      pretrained: "InstaDeepAI/nucleotide-transformer-500m-human-ref"
      local_path: "models/nucleotide-transformer-v1-500m-human-ref"
      hidden_dim: 1280   # ESM2-based, actual hidden size resolved dynamically
      num_layers: 33     # resolved dynamically after load
      hook_layers:
        early: 8    # L//4
        mid:  16    # L//2
        late: 24    # 3L//4
      # k=6 tokenisation: 512 tokens × 6bp = 3,072 bp; fits within pos limit
      max_tokens: 512
      batch_size: 16  # 4x increase; 512-token inputs are small, batching wins easily
  # SAE settings for non-EpiBERT models (expansion factor applied to each model's hidden_dim)
  sae:
    expansion: 8   # d_latent = expansion × hidden_dim
    k: 64
    lr: 3.0e-4
    batch_size: 4096
    steps: 50000

# ── HOMER motif source preference (Phase 12) ──────────────────────────────────
homer:
  source: "auto_denovo"    # prefer de novo, fall back to known
  # Options: known | denovo | auto_denovo | auto_known | merge
  n_denovo: 25             # number of de novo motifs for findMotifsGenome.pl -S
  run_script: "run_homer_with_denovo.sh"
